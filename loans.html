<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Loans | Library Helper</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1>Library Resource and Loan Helper</h1>
    <nav aria-label="Main navigation">
      <a href="index.html">Catalogue</a>
      <a href="reserve.html">Reserve</a>
      <a href="loans.html" aria-current="page">My Loans</a>
    </nav>
  </header>

  <main>
    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">Loan Summary</h2>
      <p id="loanSummary" aria-live="polite"></p>
    </section>

    <section aria-labelledby="loans-heading">
      <h2 id="loans-heading">Current Loans (sample)</h2>
      <div class="table-wrap">
        <table>
          <caption>Sample borrowed resources</caption>
          <thead>
            <tr>
              <th scope="col">Title</th>
              <th scope="col">Borrowed</th>
              <th scope="col">Due</th>
              <th scope="col">Status</th>
              <th scope="col">Fine</th>
            </tr>
          </thead>
          <tbody id="loanTable"></tbody>
        </table>
      </div>
    </section>

    <section aria-labelledby="calc-heading">
      <h2 id="calc-heading">Return Date Calculator</h2>
      <form id="calcForm" novalidate>
        <div class="form-group">
          <label for="borrowDate">Borrow date</label>
          <input type="date" id="borrowDate">
        </div>
        <div class="form-group">
          <label for="userGroup">Borrower type</label>
          <select id="userGroup">
            <option value="14">Student (14 days)</option>
            <option value="30">Lecturer (30 days)</option>
            <option value="21">Library staff (21 days)</option>
          </select>
        </div>
        <button type="submit" class="btn">Calculate</button>
      </form>
      <div id="calcResult" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <footer><p>Sample data only. Fine rate: 500 per day (sample).</p></footer>

  <script src="js/data.js"></script>
  <script src="js/loans.js"></script>
</body>
</html>
